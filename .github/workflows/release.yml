name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  zip:
    name: ZIP-Dateien anhängen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Je Skill eine ZIP-Datei bauen
        run: |
          mkdir -p dist
          cd skills
          for d in */; do
            n="${d%/}"
            zip -rq "../dist/$n.zip" "$n" -x '*/__pycache__/*' '*.pyc'
            unzip -l "../dist/$n.zip" | grep -q " $n/SKILL.md$"
          done
      - name: ZIP-Dateien an das Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.zip --clobber
